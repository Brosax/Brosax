      <text x="36" y="143" fill="#F0F7F9" font-size="80" font-weight="700" letter-spacing="3">BROSAX<tspan fill="#72E4CE">.</tspan></text>
      <text x="40" y="210" fill="#C7DBE2" font-size="32"><tspan x="40">From ideas to</tspan><tspan x="40" dy="44">working systems.</tspan></text>
      <path d="M40 298H360" stroke="#8FB9C6" stroke-opacity=".16"/>
