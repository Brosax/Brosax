<svg width="600" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" role="img" aria-labelledby="bp-m-title bp-m-desc">
<style>

  text { font-family: Arial, Helvetica, sans-serif; }
  .flow { opacity: 0; animation: bp-flow 6s linear infinite; }
  .flow-a { animation-delay: -1.3s; }
  .flow-b { animation-delay: -4.3s; }
  .breathe { opacity: .4; animation: bp-breathe 5s ease-in-out infinite; }
  @keyframes bp-flow {
    0% { stroke-dashoffset: 10; opacity: 0; }
    10% { opacity: .9; }
    56% { opacity: .9; }
    64%, 100% { stroke-dashoffset: -108; opacity: 0; }
  }
  @keyframes bp-breathe {
    0%, 100% { opacity: .25; }
    50% { opacity: .7; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flow { animation: none; opacity: 0; }
    .breathe { animation: none; opacity: .4; }
  }
</style>
      <title id="bp-m-title">Brosax 手机端电路横幅</title>
      <desc id="bp-m-desc">大字号 Brosax 标识与两行标语，右下方芯片接收缓慢流动的青色信号。</desc>
      <defs>
        <linearGradient id="bp-m-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#102332"/><stop offset=".55" stop-color="#0D1A27"/><stop offset="1" stop-color="#102C36"/></linearGradient>
        <pattern id="bp-m-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8DADB8" opacity=".12"/></pattern>
      </defs>
      <rect width="600" height="340" rx="20" fill="url(#bp-m-bg)"/>
      <rect x="410" width="170" height="340" fill="url(#bp-m-dots)"/>
