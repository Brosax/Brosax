        </g>
        <g stroke="#9BF7E3" stroke-linecap="round" aria-hidden="true">
          <path class="flow flow-a" d="M907 111H962Q978 111 978 127V159H1005" pathLength="100" stroke-width="7" stroke-dasharray="6 194" filter="url(#bp-glow)"/>
          <path class="flow flow-a" d="M907 111H962Q978 111 978 127V159H1005" pathLength="100" stroke-width="3" stroke-dasharray="6 194"/>
          <path class="flow flow-b" d="M907 249H962Q978 249 978 233V201H1005" pathLength="100" stroke-width="7" stroke-dasharray="6 194" filter="url(#bp-glow)"/>
          <path class="flow flow-b" d="M907 249H962Q978 249 978 233V201H1005" pathLength="100" stroke-width="3" stroke-dasharray="6 194"/>
        </g>
        <circle cx="978" cy="159" r="3" fill="#72E4CE"/>
        <circle cx="978" cy="201" r="3" fill="#72E4CE"/>
        <circle cx="1149" cy="288" r="3" fill="#EFC08A"/>
        <rect x="815" y="65" width="92" height="92" rx="16" fill="#112B36" stroke="#37626C"/>
        <g stroke="#79E2CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="861" cy="97" r="6"/><circle cx="844" cy="121" r="5"/><circle cx="878" cy="121" r="5"/><path d="M857 102L847 117M865 102L875 117M849 121H873"/></g>
        <text x="861" y="143" text-anchor="middle" fill="#B5CDD5" font-size="10" font-weight="600" letter-spacing="1.5">AGENTS</text>
        <rect x="815" y="203" width="92" height="92" rx="16" fill="#112B36" stroke="#37626C"/>
        <g stroke="#79E2CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M849 229L840 238L849 247M873 229L882 238L873 247M864 226L858 250"/></g>
        <text x="861" y="281" text-anchor="middle" fill="#B5CDD5" font-size="10" font-weight="600" letter-spacing="1.5">TOOLS</text>
        <rect x="1005" y="132" width="96" height="96" rx="17" fill="#183841" stroke="#70D6C7" stroke-opacity=".5"/>
        <rect class="breathe" x="1005" y="132" width="96" height="96" rx="17" stroke="#9BF7E3" stroke-width="2"/>
        <g stroke="#A3EFE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1038" y="153" width="30" height="30" rx="4"/><rect x="1046" y="161" width="14" height="14" rx="1"/><path d="M1046 148V153M1060 148V153M1046 183V188M1060 183V188M1033 161H1038M1033 175H1038M1068 161H1073M1068 175H1073"/></g>
        <text x="1053" y="212" text-anchor="middle" fill="#D1E9E8" font-size="10" font-weight="600" letter-spacing="1.5">SYSTEMS</text>
