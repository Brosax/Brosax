<svg width="1200" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="bp-title bp-desc">
<style>

  text { font-family: Arial, Helvetica, sans-serif; }
  .flow { opacity: 0; animation: bp-flow 6s linear infinite; }
  .flow-a { animation-delay: -1.3s; }
  .flow-b { animation-delay: -4.3s; }
  .breathe { opacity: .4; animation: bp-breathe 5s ease-in-out infinite; }
  @keyframes bp-flow {
    0% { stroke-dashoffset: 10; opacity: 0; }
    10% { opacity: .9; }
    56% { opacity: .9; }
    64%, 100% { stroke-dashoffset: -108; opacity: 0; }
  }
  @keyframes bp-breathe {
    0%, 100% { opacity: .25; }
    50% { opacity: .7; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flow { animation: none; opacity: 0; }
    .breathe { animation: none; opacity: .4; }
  }
</style>
      <title id="bp-title">Brosax 流动电路横幅</title>
      <desc id="bp-desc">深蓝色横幅。左侧为 BROSAX 和 From ideas to working systems。右侧薄荷青色信号沿 Agent 和 Tools 的线路缓慢流向 Systems 芯片，芯片边框轻微呼吸。</desc>
      <defs>
        <linearGradient id="bp-bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#102332"/><stop offset=".55" stop-color="#0D1A27"/><stop offset="1" stop-color="#102C36"/></linearGradient>
        <linearGradient id="bp-wire" x1="840" y1="80" x2="1110" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#70E1CE"/><stop offset="1" stop-color="#35839A"/></linearGradient>
        <pattern id="bp-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8DADB8" opacity=".12"/></pattern>
        <filter id="bp-glow" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
        <clipPath id="bp-frame"><rect width="1200" height="360" rx="20"/></clipPath>
      </defs>
      <g clip-path="url(#bp-frame)">
        <rect width="1200" height="360" fill="url(#bp-bg)"/>
        <rect x="760" width="440" height="360" fill="url(#bp-dots)"/>
        <path d="M760 0V360" stroke="#B2D0D9" stroke-opacity=".08"/>
        <path d="M64 31H134" stroke="#72E4CE" stroke-width="3" stroke-linecap="round"/>
        <circle cx="67" cy="73" r="3" fill="#EFC08A"/>
        <text class="small-label" x="82" y="78" fill="#B5CBD3" font-size="13" font-weight="600" letter-spacing="2.7">BUILD · EXPLORE · ITERATE</text>
        <text x="60" y="174" fill="#F0F7F9" font-size="84" font-weight="700" letter-spacing="5">BROSAX<tspan fill="#72E4CE">.</tspan></text>
        <text x="64" y="220" fill="#C7DBE2" font-size="26">From ideas to working systems.</text>
        <path d="M64 260H710" stroke="#8FB9C6" stroke-opacity=".16"/>
        <text class="small-label" x="64" y="299" fill="#A8C2CD" font-size="13" font-weight="500" letter-spacing="1.3">AI WORKFLOWS <tspan fill="#4D777E">/</tspan> DEVELOPER TOOLS <tspan fill="#4D777E">/</tspan> EMBEDDED SYSTEMS</text>
        <g stroke="url(#bp-wire)" stroke-width="1.5">
